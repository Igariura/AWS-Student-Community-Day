<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Organizing - AWS Community Day Kenya 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --aws-orange: #FF9900;
            --aws-dark: #232F3E;
            --aws-light: #FFFFFF;
            --badge-bg: #1a3a52;
            --accent-blue: #00D4FF;
            --aws-purple: #8B5CF6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a3a52 50%, #0f1419 100%);
            min-height: 100vh;
            padding: 2rem;
            color: white;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header-logo {
            width: 200px;
            height: auto;
            margin-bottom: 1.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            color: var(--aws-orange);
            margin-bottom: 0.5rem;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.1rem;
        }

        .content-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3rem;
            align-items: start;
        }

        /* Form Section */
        .form-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2.5rem;
            border: 2px solid rgba(255, 153, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .form-section h2 {
            font-family: 'Orbitron', sans-serif;
            color: var(--aws-orange);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background: #1a3a52;
            color: white;
            padding: 0.5rem;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--aws-orange);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .photo-upload {
            margin-top: 1rem;
        }

        .photo-upload-label {
            display: block;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 153, 0, 0.5);
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .photo-upload-label:hover {
            background: rgba(255, 153, 0, 0.1);
            border-color: var(--aws-orange);
        }

        .photo-upload input[type="file"] {
            display: none;
        }

        .photo-preview {
            margin-top: 1rem;
            text-align: center;
        }

        .photo-preview img {
            max-width: 200px;
            max-height: 200px;
            border-radius: 50%;
            border: 3px solid var(--aws-orange);
            object-fit: cover;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: var(--aws-orange);
            color: var(--aws-dark);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Orbitron', sans-serif;
        }

        .submit-btn:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.4);
        }

        .submit-btn:disabled {
            background: rgba(255, 255, 255, 0.2);
            cursor: not-allowed;
            transform: none;
        }

        /* Badge Preview Section */
        .badge-section {
            position: sticky;
            top: 2rem;
        }

        .badge-preview {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 2rem;
            border: 2px solid rgba(255, 153, 0, 0.3);
            text-align: center;
        }

        .badge-preview h3 {
            font-family: 'Orbitron', sans-serif;
            color: var(--aws-orange);
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
        }

        /* Badge Canvas Container */
        .badge-canvas-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        #badgeCanvas {
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .badge-actions {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .badge-btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .badge-btn-primary {
            background: var(--aws-orange);
            color: var(--aws-dark);
        }

        .badge-btn-primary:hover {
            background: var(--accent-blue);
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4);
        }

        .badge-btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .badge-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--aws-orange);
        }

        .back-link {
            display: inline-block;
            margin-bottom: 2rem;
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: var(--aws-orange);
            transform: translateX(-5px);
        }

        /* Responsive */
        @media (max-width: 968px) {
            .content-wrapper {
                grid-template-columns: 1fr;
            }

            .badge-section {
                position: relative;
                top: 0;
            }

            .header h1 {
                font-size: 2rem;
            }

            body {
                padding: 1rem;
            }
        }

        /* Enhanced Mobile Responsiveness */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 0.95rem;
            }

            .content-wrapper {
                grid-template-columns: 1fr;
                gap: 2rem;
            }

            .form-section {
                padding: 1.5rem;
            }

            .form-section h2 {
                font-size: 1.5rem;
            }

            .badge-preview {
                padding: 1.5rem;
            }

            .badge-preview h3 {
                font-size: 1.3rem;
            }

            .badge-actions {
                gap: 0.8rem;
            }

            .badge-btn {
                font-size: 0.9rem;
                padding: 0.7rem 1rem;
            }

            .back-link {
                font-size: 0.9rem;
                margin-bottom: 1.5rem;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .header p {
                font-size: 0.85rem;
            }

            .form-section h2 {
                font-size: 1.3rem;
            }

            .badge-preview h3 {
                font-size: 1.1rem;
            }

            .submit-btn {
                font-size: 1rem;
                padding: 0.9rem;
            }
        }

        /* Success Message */
        .success-message {
            display: none;
            background: rgba(0, 212, 255, 0.2);
            border: 2px solid var(--accent-blue);
            border-radius: 10px;
            padding: 1rem;
            margin-top: 1rem;
            text-align: center;
            color: var(--accent-blue);
            font-weight: 600;
        }

        .success-message.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Main Page</a>
        
        <div class="header">
            <h1>I'm Organizing!</h1>
            <p>Create your personalized organizer badge to share on social media</p>
        </div>

        <div class="content-wrapper">
            <!-- Badge Customization Form -->
            <div class="form-section">
                <h2>Create Your Badge</h2>
                <form id="registrationForm">
                    <div class="form-group">
                        <label>Profile Photo (Optional)</label>
                        <p style="color: rgba(255, 255, 255, 0.6); font-size: 0.9rem; margin-bottom: 0.5rem;">
                            Upload a square photo for best results. Your photo will be displayed in a circle.
                        </p>
                        <div class="photo-upload">
                            <label for="photoUpload" class="photo-upload-label">
                                <span id="uploadText">📸 Click to upload photo</span>
                            </label>
                            <input type="file" id="photoUpload" accept="image/*">
                            <div class="photo-preview" id="photoPreview"></div>
                        </div>
                    </div>

                    <div class="success-message" id="successMessage">
                        ✓ Badge generated successfully! Download it below.
                    </div>

                    <button type="submit" class="submit-btn">Generate My Badge</button>
                </form>
            </div>

            <!-- Badge Preview -->
            <div class="badge-section">
                <div class="badge-preview">
                    <h3>Your Badge Preview</h3>
                    <div class="badge-canvas-container">
                        <canvas id="badgeCanvas" width="1080" height="1080"></canvas>
                    </div>
                    <div class="badge-actions">
                        <button class="badge-btn badge-btn-primary" id="downloadBtn">
                            ⬇️ Download Badge
                        </button>
                        <button class="badge-btn badge-btn-secondary" id="shareBtn">
                            📱 Share on Social Media
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('registrationForm');
        const canvas = document.getElementById('badgeCanvas');
        const ctx = canvas.getContext('2d');
        const photoUpload = document.getElementById('photoUpload');
        const photoPreview = document.getElementById('photoPreview');
        const uploadText = document.getElementById('uploadText');
        const downloadBtn = document.getElementById('downloadBtn');
        const shareBtn = document.getElementById('shareBtn');
        const successMessage = document.getElementById('successMessage');

        let uploadedPhoto = null;
        let badgeGenerated = false;

        // Draw initial badge
        drawBadge(null);

        // Handle photo upload
        photoUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        uploadedPhoto = img;
                        
                        // Show preview
                        photoPreview.innerHTML = `<img src="${event.target.result}" alt="Preview">`;
                        uploadText.textContent = '✓ Photo uploaded';
                        
                        // Update badge
                        drawBadge(img);
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Draw final badge
            drawBadge(uploadedPhoto);
            badgeGenerated = true;
            
            // Show success message
            successMessage.classList.add('show');
            
            console.log('Badge generated successfully');
        });

        // Download badge
        downloadBtn.addEventListener('click', function() {
            if (!badgeGenerated) {
                alert('Please generate your badge first by submitting the form!');
                return;
            }
            
            const link = document.createElement('a');
            link.download = `AWS-Community-Day-Badge.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        });

        // Share badge
        shareBtn.addEventListener('click', function() {
            if (!badgeGenerated) {
                alert('Please generate your badge first by submitting the form!');
                return;
            }
            
            const text = "I'm attending AWS Community Day Kenya 2026! 🚀 Join me at Kenya's premier student cloud event. #AWSCommunityDay #CloudComputing #Kenya";
            
            if (navigator.share) {
                canvas.toBlob(function(blob) {
                    const file = new File([blob], 'badge.png', { type: 'image/png' });
                    navigator.share({
                        title: 'AWS Community Day Kenya 2026',
                        text: text,
                        files: [file]
                    }).catch(err => console.log('Share failed:', err));
                });
            } else {
                const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}`;
                window.open(twitterUrl, '_blank');
            }
        });

        // Draw badge function
        function drawBadge(photo) {
            const width = canvas.width;
            const height = canvas.height;
            
            // Clear canvas
            ctx.clearRect(0, 0, width, height);
            
            // Background gradient with purple theme
            const gradient = ctx.createLinearGradient(0, 0, width, height);
            gradient.addColorStop(0, '#1a0d2e');
            gradient.addColorStop(0.5, '#2d1b4e');
            gradient.addColorStop(1, '#1f1235');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Draw hexagon decorations (top-left) with purple theme
            drawHexagonPattern(100, 100, 80);
            drawHexagonPattern(200, 80, 60);
            
            // Draw hexagon decorations (top-right)
            drawHexagonPattern(width - 200, 80, 70);
            drawHexagonPattern(width - 100, 120, 60);
            
            // Draw hexagon decorations (bottom-right)
            drawHexagonPattern(width - 150, height - 100, 80);
            
            // Photo or placeholder
            if (photo) {
                // Draw circular photo with proper cropping
                ctx.save();
                const photoSize = 320;
                const photoY = 250;
                
                // Create circular clipping path
                ctx.beginPath();
                ctx.arc(width / 2, photoY, photoSize / 2, 0, Math.PI * 2);
                ctx.closePath();
                ctx.clip();
                
                // Calculate scaling to cover the circle
                const scale = Math.max(photoSize / photo.width, photoSize / photo.height);
                const scaledWidth = photo.width * scale;
                const scaledHeight = photo.height * scale;
                
                // Center the image
                const x = (width / 2) - (scaledWidth / 2);
                const y = photoY - (scaledHeight / 2);
                
                ctx.drawImage(photo, x, y, scaledWidth, scaledHeight);
                ctx.restore();
                
                // Draw circle border with orange
                ctx.strokeStyle = '#FF9900';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.arc(width / 2, photoY, photoSize / 2, 0, Math.PI * 2);
                ctx.stroke();
            }
            
            // "I AM ORGANIZING" text
            ctx.fillStyle = 'white';
            ctx.font = 'bold 80px Inter';
            ctx.textAlign = 'center';
            const attendingY = photo ? 490 : 350;
            ctx.fillText('I AM ORGANIZING', width / 2, attendingY);
            
            // Load and draw logo (AWS Student Community Day logo)
            const logoImg = new Image();
            logoImg.onload = function() {
                const logoWidth = 400;
                const logoHeight = (logoImg.height / logoImg.width) * logoWidth;
                const logoX = (width / 2) - (logoWidth / 2);
                const logoY = attendingY + 30;
                
                // Draw logo with rounded corners effect
                ctx.save();
                ctx.beginPath();
                ctx.roundRect(logoX, logoY, logoWidth, logoHeight, 15);
                ctx.clip();
                ctx.drawImage(logoImg, logoX, logoY, logoWidth, logoHeight);
                ctx.restore();
                
                // Continue drawing rest of badge - MERU EDITION right after logo
                drawRestOfBadge(attendingY + logoHeight + 60);
            };
            logoImg.onerror = function() {
                // If logo fails to load, continue without it
                drawRestOfBadge(attendingY + 80);
            };
            logoImg.src = 'images/logo.jpg'; // Path to your logo
            
            // If logo doesn't load immediately, draw rest after timeout
            setTimeout(() => {
                if (!logoImg.complete) {
                    drawRestOfBadge(attendingY + 80);
                }
            }, 100);
        }
        
        function drawRestOfBadge(startY) {
            const width = canvas.width;
            const height = canvas.height;
            
            // Meru Edition directly below logo with decorative elements
            const meruY = startY + 30;
            ctx.fillStyle = '#8B5CF6';
            ctx.font = 'bold 56px Orbitron';
            ctx.textAlign = 'center';
            ctx.fillText('MERU EDITION', width / 2, meruY);
            
            // Lines beside MERU EDITION
            const meruWidth = ctx.measureText('MERU EDITION').width;
            ctx.strokeStyle = '#FF9900';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(width / 2 - meruWidth / 2 - 80, meruY - 15);
            ctx.lineTo(width / 2 - meruWidth / 2 - 20, meruY - 15);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(width / 2 + meruWidth / 2 + 20, meruY - 15);
            ctx.lineTo(width / 2 + meruWidth / 2 + 80, meruY - 15);
            ctx.stroke();
            
            // Year centered below MERU EDITION
            ctx.fillStyle = '#FF9900';
            ctx.font = 'bold 64px Inter';
            ctx.fillText('2026', width / 2, meruY + 80);
            
            // Bottom section with date and location split left/right
            const bottomY = height - 100;
            
            // Date on the LEFT with emoji calendar icon
            ctx.textAlign = 'left';
            const leftX = 120;
            
            // Draw date with emoji calendar
            ctx.font = 'bold 32px Orbitron';
            ctx.fillStyle = 'white';
            ctx.fillText('📅  28th Feb, 2026', leftX, bottomY);
            
            // Location on the RIGHT with custom location pin
            const rightX = width - 120;
            
            // Draw location pin icon
            const pinX = rightX - 280;
            const pinY = bottomY - 25;
            const pinSize = 45;
            
            // Draw pin shape
            ctx.save();
            ctx.fillStyle = '#00A8E8'; // Blue color for pin
            ctx.strokeStyle = '#006D9E';
            ctx.lineWidth = 3;
            
            // Pin body (teardrop shape)
            ctx.beginPath();
            ctx.arc(pinX, pinY, pinSize / 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Pin point (bottom triangle)
            ctx.beginPath();
            ctx.moveTo(pinX - 8, pinY + 15);
            ctx.lineTo(pinX + 8, pinY + 15);
            ctx.lineTo(pinX, pinY + 35);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            
            // Inner white circle
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(pinX, pinY, pinSize / 6, 0, Math.PI * 2);
            ctx.fill();
            
            // Green shadow/base
            ctx.fillStyle = 'rgba(76, 175, 80, 0.4)';
            ctx.beginPath();
            ctx.ellipse(pinX, pinY + 38, 18, 6, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.restore();
            
            // Draw "Meru University" text next to icon - centered vertically with icon
            ctx.font = 'bold 32px Orbitron';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'left';
            ctx.fillText('Meru University', pinX + 55, bottomY + 2);
        }
        
        // Helper function to draw hexagon
        function drawHexagon(x, y, size) {
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i;
                const hx = x + size * Math.cos(angle);
                const hy = y + size * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(hx, hy);
                } else {
                    ctx.lineTo(hx, hy);
                }
            }
            ctx.closePath();
        }
        
        // Draw hexagon pattern decoration with purple theme
        function drawHexagonPattern(x, y, size) {
            ctx.save();
            ctx.translate(x, y);
            
            // Outer hexagon - orange
            ctx.strokeStyle = '#FF9900';
            ctx.lineWidth = 2.5;
            ctx.globalAlpha = 0.4;
            drawHexagon(0, 0, size);
            ctx.stroke();
            
            // Inner hexagon - purple
            ctx.strokeStyle = '#8B5CF6';
            ctx.lineWidth = 2;
            ctx.globalAlpha = 0.4;
            drawHexagon(0, 0, size * 0.7);
            ctx.stroke();
            
            ctx.restore();
        }
    </script>
</body>
</html>
